<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0b1220"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <g>
      <!-- Vertical lines -->
      <path d="M100 0 V900"/>
      <path d="M250 0 V900"/>
      <path d="M400 0 V900"/>
      <path d="M550 0 V900"/>
      <path d="M700 0 V900"/>
      <path d="M850 0 V900"/>
      <path d="M1000 0 V900"/>
      <path d="M1150 0 V900"/>
      <path d="M1300 0 V900"/>
      <path d="M1450 0 V900"/>
    </g>
    <g>
      <!-- Horizontal lines -->
      <path d="M0 120 H1600"/>
      <path d="M0 260 H1600"/>
      <path d="M0 400 H1600"/>
      <path d="M0 540 H1600"/>
      <path d="M0 680 H1600"/>
      <path d="M0 820 H1600"/>
    </g>
  </g>

  <!-- Biometric frame -->
  <rect x="350" y="170" width="900" height="560" rx="28" stroke="url(#g1)" stroke-width="3" fill="#0f172a" fill-opacity="0.6"/>
  <rect x="380" y="200" width="840" height="500" rx="20" stroke="#22c55e" stroke-opacity="0.35" stroke-width="2" fill="none"/>

  <!-- Face outline -->
  <g transform="translate(800, 450)">
    <circle r="150" fill="#111827" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="150" fill="none" stroke="url(#g1)" stroke-width="3" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="-50" cy="-20" r="10" fill="#e2e8f0"/>
    <circle cx="50" cy="-20" r="10" fill="#e2e8f0"/>
    <!-- Smile -->
    <path d="M-60 30 Q0 80 60 30" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Scan brackets -->
  <g stroke="#22c55e" stroke-width="6">
    <path d="M420 260 h80"/>
    <path d="M420 260 v80"/>
    <path d="M1180 260 h-80"/>
    <path d="M1180 260 v80"/>
    <path d="M420 640 h80"/>
    <path d="M420 640 v-80"/>
    <path d="M1180 640 h-80"/>
    <path d="M1180 640 v-80"/>
  </g>

  <!-- AWS Amplify / Rekognition hint badge -->
  <g transform="translate(1120, 160)">
    <rect x="-20" y="-20" rx="10" width="250" height="56" fill="#111827" stroke="#1f2937"/>
    <circle cx="8" cy="8" r="10" fill="url(#aws)"/>
    <text x="30" y="10" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'" font-size="18" font-weight="600">AWS Amplify • Liveness</text>
  </g>

  <!-- Caption -->
  <text x="200" y="820" fill="#e2e8f0" font-size="24" font-weight="600" opacity="0.9"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'">
    Detecting Real Users • Biometric Liveness with Rekognition
  </text>
</svg>
