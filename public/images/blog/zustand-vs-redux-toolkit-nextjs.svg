<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zustand vs Redux Toolkit with Next.js App Router cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="gradZ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="gradR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- subtle grid -->
  <g opacity="0.10" stroke="#94a3b8" stroke-width="1">
    <path d="M80 110 H1120"/>
    <path d="M80 200 H1120"/>
    <path d="M80 290 H1120"/>
    <path d="M80 380 H1120"/>
    <path d="M80 470 H1120"/>
    <path d="M80 560 H1120"/>
    <path d="M150 70 V590"/>
    <path d="M300 70 V590"/>
    <path d="M450 70 V590"/>
    <path d="M600 70 V590"/>
    <path d="M750 70 V590"/>
    <path d="M900 70 V590"/>
    <path d="M1050 70 V590"/>
  </g>

  <!-- Header / Title -->
  <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'">
    <text x="80" y="86" font-size="40" font-weight="700">Zustand vs. Redux Toolkit × Next.js</text>
    <text x="80" y="124" font-size="22" opacity="0.85">App Router • Minimal state hooks vs structured slices</text>
  </g>

  <!-- Center: Next.js panel -->
  <g filter="url(#shadow)">
    <rect x="470" y="150" width="260" height="120" rx="14" fill="#0f172a" stroke="#1f2937"/>
    <circle cx="520" cy="200" r="24" fill="#0b1220" stroke="#334155"/>
    <!-- stylized N slash -->
    <path d="M512 188 L529 212" stroke="#e5e7eb" stroke-width="3.2"/>
    <path d="M529 188 L529 212" stroke="#e5e7eb" stroke-width="3.2" opacity="0.7"/>
    <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto">
      <text x="560" y="196" font-size="18" opacity="0.85">Next.js</text>
      <text x="560" y="224" font-size="20" font-weight="700">App Router</text>
    </g>
  </g>

  <!-- Left: Zustand card -->
  <g transform="translate(120, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="280" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <!-- abstract bear-esque mark -->
    <g transform="translate(56,70)">
      <circle cx="0" cy="0" r="28" fill="#0b1220" stroke="#334155"/>
      <circle cx="-10" cy="-4" r="6" fill="#22d3ee"/>
      <circle cx="10" cy="-4" r="6" fill="#22d3ee"/>
      <path d="M-12 10 Q0 22 12 10" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto">
      <text x="110" y="85" font-size="26" font-weight="700" fill="url(#gradZ)">Zustand</text>
      <text x="110" y="112" font-size="16" fill="#cbd5e1">Provider-less • Minimal API • Hooks</text>
    </g>
    <!-- bullets -->
    <g fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="18">
      <circle cx="80" cy="150" r="6" fill="#22c55e"/>
      <text x="100" y="156">Tiny bundle (~1kb)</text>
      <circle cx="80" cy="182" r="6" fill="#22c55e"/>
      <text x="100" y="188">No boilerplate, direct actions</text>
      <circle cx="80" cy="214" r="6" fill="#22c55e"/>
      <text x="100" y="220">Great for UI/local state</text>
    </g>
  </g>

  <!-- Right: Redux Toolkit card -->
  <g transform="translate(660, 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="280" rx="16" fill="#0f172a" stroke="#1f2937"/>
    <!-- abstract toolkit mark -->
    <g transform="translate(56,70)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#0b1220" stroke="#334155"/>
      <path d="M-10 -4 H10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <path d="M-8 6 H8" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto">
      <text x="110" y="85" font-size="26" font-weight="700" fill="url(#gradR)">Redux Toolkit</text>
      <text x="110" y="112" font-size="16" fill="#cbd5e1">Slices • Immutable updates • DevTools</text>
    </g>
    <!-- bullets -->
    <g fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="18">
      <circle cx="80" cy="150" r="6" fill="#f59e0b"/>
      <text x="100" y="156">Structured &amp; scalable</text>
      <circle cx="80" cy="182" r="6" fill="#f59e0b"/>
      <text x="100" y="188">Great DevTools + RTK Query</text>
      <circle cx="80" cy="214" r="6" fill="#f59e0b"/>
      <text x="100" y="220">Requires Provider in App Router</text>
    </g>
  </g>

  <!-- Bottom bar: quick comparison -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="18" fill="#cbd5e1">
    <rect x="80" y="520" width="1040" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
    <g>
      <circle cx="120" cy="548" r="7" fill="#22c55e"/>
      <text x="140" y="553">Minimal boilerplate (Zustand)</text>
    </g>
    <g>
      <circle cx="420" cy="548" r="7" fill="#f59e0b"/>
      <text x="440" y="553">Predictable structure (RTK)</text>
    </g>
    <g>
      <circle cx="770" cy="548" r="7" fill="#60a5fa"/>
      <text x="790" y="553">Both work with App Router</text>
    </g>
  </g>
</svg>
