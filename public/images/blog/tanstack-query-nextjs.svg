<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TanStack Query with Next.js App Router cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stack"
      x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g opacity="0.10" stroke="#94a3b8" stroke-width="1">
    <path d="M80 110 H1120"/>
    <path d="M80 200 H1120"/>
    <path d="M80 290 H1120"/>
    <path d="M80 380 H1120"/>
    <path d="M80 470 H1120"/>
    <path d="M80 560 H1120"/>
    <path d="M150 70 V590"/>
    <path d="M300 70 V590"/>
    <path d="M450 70 V590"/>
    <path d="M600 70 V590"/>
    <path d="M750 70 V590"/>
    <path d="M900 70 V590"/>
    <path d="M1050 70 V590"/>
  </g>

  <!-- left: Next.js box (App Router) -->
  <g filter="url(#shadow)">
    <rect x="90" y="150" width="260" height="160" rx="14" fill="#0f172a" stroke="#1f2937"/>
    <circle cx="140" cy="200" r="26" fill="#0b1220" stroke="#334155"/>
    <!-- stylized N slash -->
    <path d="M132 188 L149 214" stroke="#e5e7eb" stroke-width="3.5"/>
    <path d="M149 188 L149 214" stroke="#e5e7eb" stroke-width="3.5" opacity="0.7"/>
    <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" >
      <text x="180" y="198" font-size="18" opacity="0.85">Next.js</text>
      <text x="180" y="226" font-size="22" font-weight="700">App Router</text>
      <text x="110" y="275" font-size="14" fill="#cbd5e1">Server Components • RSC</text>
    </g>
  </g>

  <!-- right: TanStack-like colorful stack -->
  <g transform="translate(870, 190)" filter="url(#shadow)">
    <rect x="-10" y="-10" width="250" height="250" rx="14" fill="#0f172a" stroke="#1f2937"/>
    <g transform="translate(115,115)">
      <rect x="-60" y="-60" width="120" height="120" rx="12" transform="rotate(15)" fill="url(#stack)" opacity="0.95"/>
      <rect x="-48" y="-48" width="96" height="96" rx="10" transform="rotate(15)" fill="#22d3ee" opacity="0.25"/>
      <rect x="-36" y="-36" width="72" height="72" rx="8" transform="rotate(15)" fill="#22c55e" opacity="0.25"/>
    </g>
    <text x="20" y="228" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16">TanStack Query</text>
  </g>

  <!-- center: query graph / cache state -->
  <g stroke-width="2">
    <!-- connections -->
    <g stroke="#334155" fill="none">
      <path d="M360 260 C 420 240, 520 240, 600 260 S 780 300, 840 280"/>
      <path d="M360 330 C 440 320, 520 320, 600 340 S 760 360, 840 330"/>
    </g>
    <!-- nodes -->
    <g>
      <rect x="330" y="230" width="120" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
      <circle cx="348" cy="258" r="8" fill="#22c55e"/>
      <text x="366" y="263" font-size="16" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">users</text>

      <rect x="540" y="250" width="140" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
      <circle cx="558" cy="278" r="8" fill="#60a5fa"/>
      <text x="576" y="283" font-size="16" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">posts?page=1</text>

      <rect x="740" y="260" width="120" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
      <circle cx="758" cy="288" r="8" fill="#f59e0b"/>
      <text x="776" y="293" font-size="16" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">comments</text>

      <rect x="420" y="320" width="160" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
      <circle cx="438" cy="348" r="8" fill="#22c55e"/>
      <text x="456" y="353" font-size="16" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">profile:me</text>

      <rect x="660" y="340" width="160" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
      <circle cx="678" cy="368" r="8" fill="#ef4444"/>
      <text x="696" y="373" font-size="16" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mutate:todo</text>
    </g>
  </g>

  <!-- bottom bar: features -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="18" fill="#cbd5e1">
    <rect x="80" y="520" width="1040" height="56" rx="12" fill="#0f172a" stroke="#1f2937"/>
    <g>
      <circle cx="120" cy="548" r="7" fill="#22c55e"/>
      <text x="140" y="553">Caching</text>
    </g>
    <g>
      <circle cx="270" cy="548" r="7" fill="#22c55e"/>
      <text x="290" y="553">Stale-While-Revalidate</text>
    </g>
    <g>
      <circle cx="500" cy="548" r="7" fill="#22c55e"/>
      <text x="520" y="553">Mutations + Optimistic UI</text>
    </g>
    <g>
      <circle cx="820" cy="548" r="7" fill="#22c55e"/>
      <text x="840" y="553">SSR Hydration</text>
    </g>
  </g>

  <!-- Title / Caption -->
  <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto">
    <text x="80" y="88" font-size="42" font-weight="700">TanStack Query × Next.js</text>
    <text x="80" y="128" font-size="22" opacity="0.85">App Router • Data fetching, caching, and mutations</text>
  </g>
</svg>

