    <radialGradient id="glowBlue" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="70%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>

  <!-- subtle grid -->
  <g opacity="0.10" stroke="#94a3b8" stroke-width="1">
    <path d="M80 110 H1120"/>
    <path d="M80 200 H1120"/>
    <path d="M80 290 H1120"/>
    <path d="M80 380 H1120"/>
    <path d="M80 470 H1120"/>
    <path d="M80 560 H1120"/>
    <path d="M150 70 V590"/>
    <path d="M300 70 V590"/>
    <path d="M450 70 V590"/>
    <path d="M600 70 V590"/>
    <path d="M750 70 V590"/>
    <path d="M900 70 V590"/>
