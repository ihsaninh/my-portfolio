  <!-- centered title block (safe margin for object-cover) -->
  <g fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', Helvetica, Arial">
    <!-- main title -->
    <text x="600" y="300" text-anchor="middle" font-size="56" font-weight="800">From useEffect to use()</text>
    <!-- subtitle -->
    <text x="600" y="350" text-anchor="middle" font-size="24" opacity="0.9">React 19 • Simpler data fetching and context</text>
