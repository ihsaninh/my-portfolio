<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Conventional commits and pre-commit checks illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Commit graph -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M140 180 C 220 220, 260 260, 320 300 S 420 360, 500 340"/>
    <path d="M500 340 C 580 320, 620 300, 700 320 S 820 360, 940 340"/>
  </g>
  <g fill="#10b981" stroke="#083344" stroke-width="2">
    <circle cx="140" cy="180" r="10"/>
    <circle cx="320" cy="300" r="10"/>
    <circle cx="500" cy="340" r="10"/>
    <circle cx="700" cy="320" r="10"/>
    <circle cx="940" cy="340" r="10"/>
  </g>

  <!-- Bubbles with conventional commits examples -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" filter="url(#shadow)">
    <rect x="160" y="110" rx="10" ry="10" width="430" height="70" fill="#0f172a" stroke="#1f2937"/>
    <text x="180" y="155" fill="#e2e8f0">feat(ui): improve navbar focus states</text>

    <rect x="540" y="230" rx="10" ry="10" width="420" height="70" fill="#0f172a" stroke="#1f2937"/>
    <text x="560" y="275" fill="#e2e8f0">fix(auth): handle token refresh</text>

    <rect x="260" y="360" rx="10" ry="10" width="360" height="70" fill="#0f172a" stroke="#1f2937"/>
    <text x="280" y="405" fill="#e2e8f0">docs: add setup instructions</text>
  </g>

  <!-- Checks row (pre-commit) -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="22" fill="#cbd5e1">
    <rect x="80" y="500" width="1040" height="60" rx="12" fill="#0f172a" stroke="#1f2937"/>
    <g>
      <circle cx="120" cy="530" r="8" fill="#22c55e"/>
      <text x="140" y="536">ESLint</text>
    </g>
    <g>
      <circle cx="270" cy="530" r="8" fill="#22c55e"/>
      <text x="290" y="536">Prettier</text>
    </g>
    <g>
      <circle cx="430" cy="530" r="8" fill="#22c55e"/>
      <text x="450" y="536">Tests</text>
    </g>
    <g>
      <circle cx="560" cy="530" r="8" fill="#22c55e"/>
      <text x="580" y="536">Commitlint</text>
    </g>
  </g>

  <!-- Title -->
  <g fill="#e2e8f0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    <text x="80" y="80" font-size="44" font-weight="700">Clean commits, enforced locally</text>
    <text x="80" y="120" font-size="24" opacity="0.85">Husky pre-commit hooks + Conventional Commits</text>
  </g>
</svg>
