<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Battle Icon">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1c1c22"/>

  <!-- Subtle center glow -->
  <radialGradient id="g" cx="50%" cy="42%" r="60%">
    <stop offset="0%" stop-color="#27272c" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#27272c" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>

  <!-- Opposing chat bubbles (knowledge duel) -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bubble -->
    <rect x="88" y="176" width="168" height="120" rx="28"/>
    <path d="M256 236 L284 256 L256 276"/>

    <!-- Right bubble -->
    <rect x="256" y="176" width="168" height="120" rx="28"/>
    <path d="M256 236 L228 256 L256 276"/>
  </g>

  <!-- Conversation dots -->
  <g fill="#ffffff">
    <!-- Left dots -->
    <circle cx="140" cy="236" r="10"/>
    <circle cx="168" cy="236" r="10"/>
    <circle cx="196" cy="236" r="10"/>
    <!-- Right dots -->
    <circle cx="316" cy="236" r="10"/>
    <circle cx="344" cy="236" r="10"/>
    <circle cx="372" cy="236" r="10"/>
  </g>

  <!-- Clash spark at the center -->
  <g stroke="#3b82f6" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="204" x2="256" y2="236"/>
    <line x1="256" y1="276" x2="256" y2="308"/>
    <line x1="236" y1="256" x2="204" y2="256"/>
    <line x1="308" y1="256" x2="276" y2="256"/>
    <line x1="244" y1="228" x2="224" y2="208"/>
    <line x1="288" y1="304" x2="268" y2="284"/>
    <line x1="268" y1="228" x2="288" y2="208"/>
    <line x1="224" y1="304" x2="244" y2="284"/>
  </g>

  <!-- Accent ring to add focus -->
  <circle cx="256" cy="248" r="168" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="12"/>
</svg>
