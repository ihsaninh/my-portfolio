# SonarQube configuration for Next.js portfolio project
sonar.projectKey=my-portofolio-next
sonar.projectName=My Portfolio Next.js
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src,app

# Exclusions - ignore build artifacts and generated files
sonar.exclusions=**/.next/**,**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/coverage/**,**/.vscode/**,**/.git/**

# Test configurations
sonar.tests=tests
sonar.test.exclusions=**/node_modules/**,**/.next/**

# Language specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/tests/**,**/.next/**,**/node_modules/**